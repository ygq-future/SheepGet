name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Windows x64'
            os: windows-latest
          - name: 'macOS Apple Silicon'
            os: macos-latest
          - name: 'Linux x86_64'
            os: ubuntu-24.04

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - run: node scripts/bootstrap.mjs --ci

      - name: Run Quality Gate Check
        run: node scripts/quality-gate.mjs

      - name: Build frontend
        run: bun run --cwd frontend build

      - name: Package distribution artifacts
        run: node scripts/package.mjs

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9ec8723d33963d3cb2430f80
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag || 'v1.0.0' }}
          draft: false
          prerelease: false
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.msi
            dist/*.tar.gz
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS.txt
