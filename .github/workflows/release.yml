name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.11'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: Pre-Flight Quality Gate Check (Cross-Platform Matrix)
  # --------------------------------------------------------------------------
  quality:
    name: Quality Gate (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Windows x64'
            os: windows-latest
          - name: 'macOS Apple Silicon'
            os: macos-latest
          - name: 'Linux x86_64'
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: ffmpeg -version
      - run: ffprobe -version

      - run: node scripts/bootstrap.mjs --ci

      - name: Run Quality Gate Check
        run: node scripts/quality-gate.mjs

  # --------------------------------------------------------------------------
  # Stage 2: Cross-Platform Build & Package (Only runs after quality gate passes)
  # --------------------------------------------------------------------------
  build:
    name: Build & Package (${{ matrix.name }})
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Windows x64'
            os: windows-latest
          - name: 'macOS Apple Silicon'
            os: macos-latest
          - name: 'Linux x86_64'
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config squashfs-tools
          sudo wget -q -O /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - run: node scripts/bootstrap.mjs --ci

      - name: Build frontend
        run: bun run --cwd frontend build

      - name: Package distribution artifacts
        run: node scripts/package.mjs

      - name: Determine Tag Name and Release Notes
        id: tag_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag || 'v1.0.11' }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [ -f ".github/release-note/${TAG}.md" ]; then
            echo "body_path=.github/release-note/${TAG}.md" >> $GITHUB_OUTPUT
          elif [ -f ".github/release-note/v1.0.0.md" ]; then
            echo "body_path=.github/release-note/v1.0.0.md" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: 'SheepGet ${{ steps.tag_info.outputs.tag }}'
          body_path: ${{ steps.tag_info.outputs.body_path }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            build/dist/*.zip
            build/dist/*.exe
            build/dist/*.msi
            build/dist/*.tar.gz
            build/dist/*.dmg
            build/dist/*.deb
            build/dist/*.AppImage

  # 每个平台的打包 job 只上传自己的安装包：SHA256SUMS 若也在这里上传，三个平台会互相覆盖，
  # 最终文件只列最后上传那个平台的产物。汇总 job 等全部产物就位后统一生成一次。
  checksums:
    name: Compute Release Checksums
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download published packages
        id: tag_info
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag || 'v1.0.11' }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p build/dist
          gh release download "$TAG" --repo "${{ github.repository }}" --dir build/dist --clobber \
            --pattern '*.zip' --pattern '*.exe' --pattern '*.msi' --pattern '*.tar.gz' \
            --pattern '*.dmg' --pattern '*.deb' --pattern '*.AppImage'

      - name: Write checksum manifest
        shell: bash
        run: |
          cd build/dist
          find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.msi' \
            -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksum manifest
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          files: build/dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
