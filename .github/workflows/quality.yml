name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - run: node scripts/bootstrap.mjs --ci
      - name: Check sources and native build
        run: node scripts/quality-gate.mjs --ci
        env:
          GOFLAGS: ${{ runner.os == 'Linux' && '-tags=webkit2_41' || '' }}
      - name: Check commit range
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then
            BASE=ROOT
          fi
          node scripts/quality-gate.mjs --range "$BASE" "$HEAD"
  required:
    if: always()
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Require all platform checks
        env:
          RESULT: ${{ needs.quality.result }}
        run: test "$RESULT" = success
