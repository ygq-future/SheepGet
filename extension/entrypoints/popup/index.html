<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheepGet</title>
    <style>
      /* 弹窗高度由内容决定：不给 body 设最小高度——内容只有一两条资源时它比内容高，
          露出来的就是这一大块背景。背景色与 App 根节点一致，任何情况下都不可能出现色差。 */
      body {
        margin: 0;
        padding: 0;
        width: 360px;
        background: #090d16;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* 「刷新连接」按钮在验证中的旋转指示；inline style 无法声明 keyframes。 */
      @keyframes sheepget-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
