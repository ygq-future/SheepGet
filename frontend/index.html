<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SheepGet</title>
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('sheepget_theme') || 'system';
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = theme === 'dark' || (theme === 'system' && prefersDark);
          document.documentElement.classList.add(isDark ? 'dark' : 'light');
          const isMac =
            (navigator.platform && navigator.platform.toUpperCase().indexOf('MAC') >= 0) ||
            (navigator.userAgent && navigator.userAgent.toUpperCase().indexOf('MAC') >= 0);
          if (isMac) document.documentElement.classList.add('is_mac');
        } catch {
          // Fallback if localStorage or matchMedia is inaccessible
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="./src/main.tsx" type="module"></script>
  </body>
</html>
